<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>総合診療カンファレンス ― 研修医から医長へ</title>
<style>
:root{
  --bg-deep:#E9EFEA;
  --panel:#FFFFFF;
  --panel2:#F1F5F2;
  --paper:#FBF7EC;
  --paper-line:#E3D9BE;
  --ink:#2B3A32;
  --ink-soft:#5F7268;
  --ecg:#1E9E6B;
  --alert:#D14A42;
  --gold:#B8860B;
  --line:#D7DFDA;
  --line-soft:#E6ECE8;
  --blue:#3D7FBF;
  --text-dark:#263029;
  --text-mid:#526258;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at top, #FFFFFF 0%, var(--bg-deep) 75%);
  color:var(--text-dark);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
}
#root{width:100%;max-width:920px;padding:0 0 40px;}
::selection{background:var(--ecg);color:#fff;}

/* ---------- ECG header ---------- */
.ecg-header{position:relative;background:linear-gradient(180deg,#F3FAF6,#E6F3EB);border-bottom:1px solid var(--line);padding:6px 16px 4px;overflow:hidden;}
.ecg-header svg{display:block;width:100%;height:28px;}
.ecg-header path{fill:none;stroke:var(--ecg);stroke-width:2.2;stroke-dasharray:1000;stroke-dashoffset:1000;animation:ecgdraw 3.2s linear infinite;filter:drop-shadow(0 0 3px rgba(30,158,107,.4));}
@keyframes ecgdraw{0%{stroke-dashoffset:1000;}100%{stroke-dashoffset:0;}}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 4px;flex-wrap:wrap;gap:8px;}
.brand{font-family:"Hiragino Mincho ProN","Shippori Mincho","Yu Mincho",serif;font-size:19px;letter-spacing:.06em;color:var(--text-dark);}
.brand small{display:block;font-size:9.5px;color:var(--ecg);letter-spacing:.2em;font-family:inherit;margin-top:2px;}
.hud{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-mid);flex-wrap:wrap;}
.hud .badge{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;display:flex;align-items:center;gap:6px;}
.hud .badge b{color:var(--gold);font-weight:700;}
.hud .badge.rep-up b{color:var(--ecg);}
.hud .badge.rep-down b{color:var(--alert);}
.iconbtn{background:#fff;border:1px solid var(--line);color:var(--text-mid);border-radius:20px;padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s;}
.iconbtn:hover{border-color:var(--ecg);color:var(--ecg);}

/* ---------- reputation bar ---------- */
.progresswrap{padding:0 18px 12px;}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-mid);margin-bottom:4px;}
.progressbar{height:7px;border-radius:4px;background:#E1E8E3;overflow:hidden;border:1px solid var(--line);position:relative;}
.progressbar>div{height:100%;background:linear-gradient(90deg,var(--ecg),var(--gold));transition:width .5s;}
.progressbar.danger>div{background:linear-gradient(90deg,var(--alert),#8a2f2a);}

/* ---------- main content ---------- */
main{padding:10px 16px 16px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(38,50,42,.05);}
.card h2{font-family:"Hiragino Mincho ProN","Shippori Mincho",serif;font-size:18px;margin:0 0 10px;color:var(--text-dark);border-left:3px solid var(--ecg);padding-left:10px;}
.muted{color:var(--text-mid);font-size:14px;line-height:1.75;}
.btn{background:var(--ecg);color:#fff;border:none;border-radius:6px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;letter-spacing:.03em;}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--text-dark);font-weight:500;}
.btn.secondary:hover{border-color:var(--ecg);color:var(--ecg);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

/* ---------- title screen ---------- */
.title-screen{text-align:center;padding:26px 20px 8px;}
.title-screen h1{font-family:"Hiragino Mincho ProN","Shippori Mincho",serif;font-size:27px;margin:10px 0 6px;letter-spacing:.05em;color:var(--text-dark);}
.title-screen .sub{color:var(--ecg);letter-spacing:.28em;font-size:11.5px;margin-bottom:16px;font-weight:700;}
.title-screen p{color:var(--text-mid);font-size:13.5px;line-height:1.85;max-width:540px;margin:0 auto 16px;}
.hero-hospital{margin:0 auto 12px;width:160px;}
.hero-hospital svg{width:100%;height:auto;}

/* ---------- game disclaimer ---------- */
.disclaimer-box{background:#FBF1DC;border:1px solid var(--gold);border-radius:8px;padding:10px 14px;margin:14px 0;font-size:12px;line-height:1.7;color:#7a5a1e;text-align:left;}

/* ---------- mentor speech bubble ---------- */
.mentor-bubble-wrap{display:flex;gap:12px;align-items:flex-start;margin:14px 0;text-align:left;}
.mentor-avatar{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:#F3E6F0;border:2px solid #C98BC9;display:flex;align-items:center;justify-content:center;font-size:22px;}
.mentor-bubble{position:relative;flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;border-top-left-radius:2px;padding:12px 15px;font-size:13.5px;line-height:1.85;color:var(--text-dark);}
.mentor-name{font-size:11px;color:#9c5fa0;font-weight:700;margin-bottom:4px;}
.nurse-bubble{display:inline-flex;align-items:center;gap:4px;background:#FDECEA;border:1px solid var(--alert);border-radius:12px;padding:3px 10px;font-size:11px;color:#A6362F;margin-left:6px;white-space:nowrap;}

/* ---------- batch dots / badges ---------- */
.weekdots{display:flex;gap:8px;justify-content:center;margin:14px 0 6px;}
.weekdot{width:28px;height:28px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-mid);}
.weekdot.filled{background:var(--ecg);color:#fff;border-color:var(--ecg);font-weight:700;}
.badgerow{display:flex;gap:10px;justify-content:center;margin:6px 0 14px;}
.badge-item{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;border:1px solid var(--line);background:var(--panel2);}
.badge-item.on{border-color:var(--gold);background:#FBF1DC;box-shadow:0 0 8px rgba(184,134,11,.25);}
.badge-item.off{opacity:.35;filter:grayscale(1);}

/* ---------- patient chart doc ---------- */
.arrival-banner{font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.arrival-banner.ambulance{background:#FDECEA;color:#A6362F;border:1px solid var(--alert);animation:amb-flash 1.1s infinite;}
.arrival-banner.inhospital{background:#FBF1DC;color:#8a6b1f;border:1px solid var(--gold);}
@keyframes amb-flash{0%,100%{opacity:1;}50%{opacity:.65;}}
.urgent-tag{display:inline-block;font-size:11.5px;background:#FBE4E2;color:var(--alert);border-radius:10px;padding:2px 9px;margin-left:6px;font-weight:700;vertical-align:middle;}

.chart-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px;}
.avatar-box{flex:0 0 auto;width:74px;height:74px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;border:2px solid var(--panel2);box-shadow:0 0 0 1px var(--line);}
.avatar-box svg{width:56px;height:56px;}
.chart-idbox{flex:1;min-width:180px;}
.chart-idbox .pname{font-size:16px;font-weight:700;color:var(--text-dark);}
.chart-idbox .pmeta{font-size:13.5px;color:var(--text-mid);margin-top:2px;}
.vitals{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.vital{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px;color:var(--text-dark);}
.vital.abnormal{background:#FDECEA;border-color:var(--alert);}
.vital.abnormal b{color:var(--alert);}
.vital b{color:var(--ecg);}

.bodybox{flex:0 0 auto;width:96px;text-align:center;}
.bodysvg{width:80px;height:auto;}
.bodymark-ring{fill:none;stroke:var(--alert);stroke-width:2;animation:ringpulse 1.4s infinite;}
@keyframes ringpulse{0%{r:3;opacity:1;}100%{r:10;opacity:0;}}
.bodybox .bodylabel{font-size:11px;color:var(--text-mid);margin-top:2px;}

.intakeform{background:var(--paper);color:var(--ink);border:1px solid var(--paper-line);border-radius:8px;padding:14px 16px;margin-top:6px;}
.intakeform .iform-title{font-size:12px;letter-spacing:.12em;color:var(--ink-soft);border-bottom:1px dashed var(--paper-line);padding-bottom:6px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;}
.iform-sec{margin:10px 0;font-size:14.5px;line-height:1.85;}
.iform-sec .seclabel{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--ink-soft);border-radius:8px;padding:1px 9px;margin-right:6px;vertical-align:middle;}
.iform-sec.chief .seclabel{background:var(--alert);}
.iform-sec.hpi .seclabel{background:#3f7a5c;}
.iform-sec.pmh .seclabel{background:#3d6a94;}
.iform-sec.social .seclabel{background:#8a6b1f;}
.iform-sec.family .seclabel{background:#7a4f94;}

.resultsdoc{margin-top:10px;}
.resultsdoc h3{font-size:12px;letter-spacing:.1em;color:var(--text-mid);border-bottom:1px dashed var(--line-soft);padding-bottom:6px;margin:14px 0 8px;}
.resultentry{background:var(--paper);border:1px solid var(--paper-line);color:var(--ink);border-radius:8px;padding:12px 15px;margin-bottom:9px;font-size:14.5px;line-height:1.8;}
.resultentry .rname{font-weight:700;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:4px 8px;}
.resultentry .rname>span:first-child{flex:1;min-width:0;}
.resultentry .rcost{font-size:11.5px;color:var(--ink-soft);font-weight:400;}
.empty-note{color:var(--text-mid);font-size:13.5px;font-style:italic;margin:6px 0;}

.term{color:var(--ecg);font-weight:700;}
.term-note{display:inline;color:var(--text-mid);font-size:.95em;font-weight:400;font-style:normal;}
.explain .term-note,.intakeform .term-note{color:#6a4f10;}
.resultentry .term-note{color:#6a4f10;}

/* ---------- urgency meter ---------- */
.urgencymeter{margin:10px 0;border-radius:8px;padding:8px 11px;border:1px solid var(--line);background:var(--panel2);}
.urgencymeter.warn{border-color:#B08A2E;background:#FBF1DC;}
.urgencymeter.crit{border-color:var(--alert);background:#FDECEA;animation:pulse-crit 1s infinite;}
@keyframes pulse-crit{0%,100%{box-shadow:0 0 0 rgba(209,74,66,0);}50%{box-shadow:0 0 12px rgba(209,74,66,.35);}}
.um-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--text-dark);margin-bottom:5px;}
.um-msg{color:#A6552A;font-weight:600;}
.urgencymeter.crit .um-msg{color:var(--alert);}
.um-track{height:7px;border-radius:4px;background:#E1E8E3;overflow:hidden;border:1px solid var(--line);}
.um-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--alert));transition:width .3s;}

/* ---------- 指導医のアドバイス（候補病名の説明・静的表示） ---------- */
.diffboard{margin:10px 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.diffboard-label{font-size:13px;color:var(--text-dark);margin-bottom:9px;display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;font-weight:600;}
.diffboard-label .mentor-icon{font-size:18px;flex:0 0 auto;}
.advice-list{display:flex;flex-direction:column;gap:8px;}
.advice-item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;}
.advice-item b{font-size:13.5px;color:var(--text-dark);}
.advice-item p{margin:4px 0 0;font-size:12.5px;color:var(--text-mid);line-height:1.6;}

/* ---------- test menu ---------- */
.testcatlabel{font-size:12.5px;color:var(--text-mid);letter-spacing:.08em;margin:14px 0 7px;font-weight:700;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:6px;}
.optcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:13px 15px;cursor:pointer;transition:.15s;font-size:14.5px;}
.optcard:hover:not(.done){border-color:var(--ecg);transform:translateY(-1px);box-shadow:0 2px 6px rgba(30,158,107,.12);}
.optcard .otitle{font-weight:700;color:var(--text-dark);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:6px 8px;}
.optcard .otitle>span:first-child{flex:1;min-width:0;}
.optcard .cost{font-size:12.5px;color:#8a6b1f;background:#FBF1DC;border-radius:10px;padding:3px 10px;white-space:nowrap;}
.optcard.done{cursor:default;background:#EAF6EF;border-color:#9FD9BB;}
.optcard .result-inline{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-soft);font-size:14px;line-height:1.75;color:var(--text-dark);}
.optcard .result-inline .labbar .track{background:#E4E9E5;}

/* lab bar */
.labbar{margin:6px 0;}
.labbar .lrow{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px;}
.labbar .track{position:relative;height:8px;background:#E4DCC4;border-radius:4px;overflow:visible;}
.labbar .range{position:absolute;height:100%;background:#B9D8C7;border-radius:4px;}
.labbar .marker{position:absolute;top:-3px;width:3px;height:14px;background:var(--alert);border-radius:2px;}
.labbar .marker.normal{background:#2C7A4F;}

/* ---------- diagnosis screen ---------- */
.diaggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.diagcard{background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:13px 15px;cursor:pointer;font-size:14.5px;line-height:1.5;transition:.15s;color:var(--text-dark);}
.diagcard:hover{border-color:var(--ecg);}
.diagcard.sel{border-color:var(--ecg);background:#E2F5EA;font-weight:700;}
.diaghint{font-size:10.5px;margin-left:4px;font-weight:400;color:var(--text-mid);}
.dispgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.dispcard{background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;transition:.15s;}
.dispcard:hover{border-color:var(--ecg);}
.dispcard.sel{border-color:var(--ecg);background:#E2F5EA;}
.dispcard .dtitle{font-weight:700;font-size:15px;margin-bottom:4px;color:var(--text-dark);}
.dispcard .ddesc{font-size:13px;color:var(--text-mid);line-height:1.7;}

/* ---------- handover / submitted screen ---------- */
.handover-screen{text-align:center;padding:30px 20px;}
.handover-screen .letter{width:130px;margin:0 auto 16px;font-size:52px;}
.handover-screen .letter svg{width:100%;height:auto;}
.stamp{display:inline-block;font-size:14px;letter-spacing:.13em;color:var(--gold);border:2px solid var(--gold);border-radius:6px;padding:8px 19px;transform:rotate(-3deg);margin-bottom:16px;background:#FBF1DC;}

/* ---------- evaluation review ---------- */
.conf-heading{text-align:center;padding:8px 0 4px;}
.conf-heading .day{color:var(--gold);font-size:12.5px;letter-spacing:.16em;font-weight:700;}
.conf-heading h2{font-family:"Hiragino Mincho ProN","Shippori Mincho",serif;font-size:22px;margin:6px 0 0;border:none;padding:0;color:var(--text-dark);}
.confroom-badge{font-size:32px;text-align:center;margin-bottom:4px;}
.weeksummarybar{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--gold);border-radius:10px;padding:13px 16px;margin-bottom:14px;flex-wrap:wrap;gap:6px;color:var(--text-dark);}
.weeksummarybar .wtotal{font-size:24px;font-weight:700;font-family:"Hiragino Mincho ProN",serif;}
.weeksummarybar .wtotal.pos{color:var(--ecg);}
.weeksummarybar .wtotal.neg{color:var(--alert);}
.weekcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.weekcard summary{padding:13px 16px;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-size:14.5px;flex-wrap:wrap;gap:6px;color:var(--text-dark);}
.weekcard summary::-webkit-details-marker{display:none;}
.weekcard summary .wname{font-weight:700;color:var(--text-dark);}
.weekcard summary .wverdicts{display:flex;gap:5px;flex-wrap:wrap;}
.weekcard .wbody{padding:0 15px 14px;}
.crashcard summary{background:#FDECEA;}
.resultrow{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0;}
.resultbox{flex:1;min-width:200px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
.resultbox h4{margin:0 0 7px;font-size:12.5px;color:var(--text-mid);letter-spacing:.06em;}
.resultbox .yourans{font-size:14.5px;margin-bottom:6px;color:var(--text-dark);}
.correctans{font-size:14.5px;color:#0F7A4F;font-weight:700;}
.verdict{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:5px;}
.verdict.ok{background:#DFF3E7;color:#0F7A4F;}
.verdict.ng{background:#FBE0DE;color:#B23A34;}
.explain{background:var(--paper);border:1px solid var(--paper-line);color:var(--ink);border-radius:8px;padding:15px 17px;font-size:14.5px;line-height:1.9;margin-top:10px;}
.scorebreak{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0;}
.scorepill{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;color:var(--text-dark);}
.scorepill.pos b{color:#0F7A4F;}
.scorepill.neg b{color:#B23A34;}

/* ---------- crisis / game over ---------- */
.crisis-card{text-align:center;padding:30px 20px;border-color:var(--alert)!important;background:linear-gradient(180deg,#FDECEA,#FFFFFF);}
.crisis-flash{font-size:52px;animation:crisis-shake 0.5s infinite;}
@keyframes crisis-shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.crisis-title{color:var(--alert);font-family:"Hiragino Mincho ProN",serif;font-size:22px;margin:10px 0;}
.crisis-body{color:#6b3530;font-size:13.5px;line-height:1.85;max-width:480px;margin:0 auto 8px;}

.gameover-screen{text-align:center;padding:50px 20px;}
.gameover-icon{font-size:56px;opacity:.75;}
.gameover-title{font-family:"Hiragino Mincho ProN",serif;font-size:28px;color:#5f6b73;margin:16px 0 8px;letter-spacing:.1em;}
.gameover-body{color:#5f6b73;font-size:14px;line-height:2;max-width:480px;margin:0 auto 20px;}
.gameover-stats{color:var(--text-mid);font-size:13px;margin-bottom:20px;}

/* ---------- evaluation modal / glossary modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(30,40,35,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:linear-gradient(180deg,#FFFFFF,#F4F7F5);border:1px solid var(--gold);border-radius:14px;padding:30px 26px;max-width:440px;text-align:center;box-shadow:0 10px 40px rgba(38,50,42,.18);}
.modal .rank-emoji{font-size:50px;}
.modal h2{font-family:"Hiragino Mincho ProN",serif;color:var(--gold);font-size:22px;margin:10px 0 4px;}
.modal p{color:var(--text-dark);font-size:14px;line-height:1.85;}
.eval-stats{display:flex;flex-direction:column;gap:8px;margin:16px 0;text-align:left;}
.eval-stat{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--text-mid);}
.eval-stat b{font-size:15px;color:var(--gold);}
.eval-stat b.pos{color:#0F7A4F;}
.eval-stat b.neg{color:#B23A34;}
.glossary-list{max-height:60vh;overflow-y:auto;margin-top:10px;}
.gitem{padding:9px 0;border-bottom:1px solid var(--line-soft);text-align:left;}
.gitem b{color:var(--ecg);font-size:14px;}
.gitem p{margin:4px 0 0;font-size:13px;color:var(--text-mid);line-height:1.7;}

footer.gamefooter{text-align:center;color:var(--text-mid);font-size:12.5px;padding:18px 0 0;line-height:1.6;}

@media(max-width:520px){
  .title-screen h1{font-size:22px;}
  .card{padding:13px;}
  .chart-head{flex-direction:column;align-items:center;text-align:center;}
  .chart-idbox{text-align:left;width:100%;}
  .bodybox{align-self:center;}
  .grid{grid-template-columns:1fr;}
  .diaggrid{grid-template-columns:1fr;}
  .dispgrid{grid-template-columns:1fr;}
  .hud{gap:7px;}
  .hud .badge{padding:5px 10px;font-size:12px;}
  .btn{width:100%;text-align:center;}
  .btn.secondary{width:100%;text-align:center;}
  .weeksummarybar{flex-direction:column;align-items:flex-start;}
  .resultrow{flex-direction:column;}
}
@media(min-width:521px) and (max-width:900px){

function esc(s){ return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* 同じ症例でも毎回同じ主訴の文面だと丸暗記されてしまうため、
   chiefVariants があればその中からランダムに1つ選ぶ（無ければ標準の chief を使う）。 */
function pickChiefVariant(c){
  if(c.chiefVariants && c.chiefVariants.length>0){
    const all = [c.chief, ...c.chiefVariants];
    return all[Math.floor(Math.random()*all.length)];
  }
  return c.chief;
}

/* ============================================================
   2周目・3周目では、同じ症例（同じ病態・問診・検査内容）でも
   患者の氏名・年齢・性別を変えて「別の患者」として再登場させる。
   小児症例（母親の付き添いを前提とした問診など）や、妊娠・前立腺など
   性別に医学的な意味がある症例は年齢・性別を変えない。
   ============================================================ */
const ALT_MALE_NAMES = ['佐々木 健一','村田 隆','平野 修','土屋 誠','近藤 学','菅原 剛','桜井 大輔','福田 洋一','杉山 拓真','宮本 直樹'];
const ALT_FEMALE_NAMES = ['金子 真理','後藤 直美','阿部 美穂','石川 恵','小川 千尋','清水 由紀子','斉藤 麻衣子','村上 智恵','原田 早苗','荒木 明日香'];
const GENDER_SENSITIVE_KEYWORDS = ['妊娠','妊婦','産後','前立腺','精巣','陰嚢','卵巣','子宮','腟','膣','閉経','月経','生理','乳がん','乳房','褥婦'];
function isGenderSensitive(c){
  const text = c.chief + ' ' + c.qa.map(q=>q.a).join(' ') + ' ' + c.explain;
  return GENDER_SENSITIVE_KEYWORDS.some(k=>text.includes(k));
}
function buildIdentity(c, loopStage, rngSeed){
  // loopStage: 1=そのまま／2・3=見た目を変える
  if(loopStage===1 || c.specialty==='pediatric' || c.age<18){
    return {name:c.name, age:c.age, gender:c.gender, seed:c.seed};
  }
  const rnd = (n)=> Math.abs(Math.sin(rngSeed*13.37 + n*7.77)) % 1;
  let gender = c.gender;
  if(!isGenderSensitive(c) && rnd(1) < 0.4){
    gender = (c.gender==='男性') ? '女性' : '男性';
  }
  const names = gender==='女性' ? ALT_FEMALE_NAMES : ALT_MALE_NAMES;
  const name = names[Math.floor(rnd(2)*names.length)];
  const shiftRange = loopStage===2 ? 12 : 18;
  const shift = Math.floor((rnd(3)*2 - 1) * shiftRange);
  const age = Math.max(20, Math.min(90, c.age + shift));
  const seed = c.seed + loopStage*97 + Math.floor(rnd(4)*1000);
  return {name, age, gender, seed};
}

/* 医療用語には必ず、わかりやすい注釈をインライン表示する（毎回・省略なし）。 */
function withGlossary(text){
  let out = esc(text);
  out = out.replace(/\*\*(.+?)\*\*/g, (m, term)=>{
    const def = GLOSSARY_FULL[term];
    if(!def) return `<b>${esc(term)}</b>`;
    return `<span class="term">${esc(term)}</span><span class="term-note">（${esc(def)}）</span>`;
  });
  return out;
}
/* **での明示的マークアップがない検査名などにも、含まれる医療用語を自動検出して注釈を付ける
   （検査を選ぶ時点、まだ結果が出る前でも用語の意味がわかるように）。 */
const GLOSSARY_TERMS_BY_LENGTH = Object.keys(GLOSSARY_FULL).sort((a,b)=>b.length-a.length);
function autoGlossary(text){
  let matched = null;
  for(const term of GLOSSARY_TERMS_BY_LENGTH){ if(text.includes(term)){ matched = term; break; } }
  if(!matched) return esc(text);
  const idx = text.indexOf(matched);
  const before = esc(text.slice(0,idx));
  const after = esc(text.slice(idx+matched.length));
  return `${before}<span class="term">${esc(matched)}</span><span class="term-note">（${esc(GLOSSARY_FULL[matched])}）</span>${after}`;
}

function labBar(label, value, unit, min, max, dispMin, dispMax, abnormal){
  dispMin = dispMin===undefined?min - (max-min)*0.6:dispMin;
  dispMax = dispMax===undefined?max + (max-min)*1.2:dispMax;
  const pct = v => Math.max(0,Math.min(100,((v-dispMin)/(dispMax-dispMin))*100));
  const rangeL = pct(min), rangeR = pct(max);
  const markerPos = pct(value);
  return `<div class="labbar">
    <div class="lrow"><span>${label}（基準値 ${min}〜${max} ${unit}）</span><span style="font-weight:700;color:${abnormal?'#B23A2E':'#2C7A4F'}">${value} ${unit} ${abnormal?'⚠異常':'正常'}</span></div>
    <div class="track">
      <div class="range" style="left:${rangeL}%;width:${rangeR-rangeL}%;"></div>
      <div class="marker ${abnormal?'':'normal'}" style="left:${markerPos}%;"></div>
    </div>
  </div>`;
}

/* バイタルサインの異常判定と、それに気づいた看護師のひとことコメント */
function vitalCheck(type, valueStr){
  const nums = (valueStr.match(/-?\d+\.?\d*/g)||[]).map(Number);
  if(nums.length===0) return {abnormal:false};
  if(type==='temp'){
    const t = nums[0];
    if(t>=38.0) return {abnormal:true, note:'高熱が出ています'};
    if(t>=37.5) return {abnormal:true, note:'微熱がありますね'};
    if(t<36.0) return {abnormal:true, note:'体温が低めです'};
    return {abnormal:false};
  }
  if(type==='bp'){
    const sys=nums[0], dia=nums[1];
    if(sys!==undefined && (sys>=140 || (dia!==undefined && dia>=90))) return {abnormal:true, note:'血圧が高めです'};
    if(sys!==undefined && sys<90) return {abnormal:true, note:'血圧が低めです'};
    return {abnormal:false};
  }
  if(type==='pulse'){
    const p = nums[0];
    if(p>100) return {abnormal:true, note:'脈が速いです'};
    if(p<60) return {abnormal:true, note:'脈が遅めです'};
    return {abnormal:false};
  }
  if(type==='spo2'){
    const o = nums[0];
    if(o<95) return {abnormal:true, note:'酸素飽和度が下がっています'};
    return {abnormal:false};
  }
  return {abnormal:false};
}
function vitalHtml(label, type, value){
  const check = vitalCheck(type, value);
  return `<div class="vital ${check.abnormal?'abnormal':''}">${label} <b>${esc(value)}</b>${check.abnormal?`<span class="nurse-bubble">👩‍⚕️${check.note}</span>`:''}</div>`;
}

/* 問診票の内容を自動分類するための簡易ヒューリスティック（症例データを手直しせず再利用） */
function questionCategory(q){
  if(/既往歴|持病|指摘された|内服|薬/.test(q)) return 'pmh';
  if(/家族/.test(q)) return 'family';
  if(/喫煙|飲酒|生活習慣|職業|食事|塩分|水分摂取|生活/.test(q)) return 'social';
  return 'hpi'; // 現病歴（症状の性質・経過・随伴症状・悪化寛解因子など）
}
function buildIntakeForm(c){
  const groups = {hpi:[], pmh:[], social:[], family:[]};
  c.qa.forEach(q=>{ groups[questionCategory(q.q)].push(q.a); });
  return {
    hpi: groups.hpi.join(' ') || '詳細な記載はありません。',
    pmh: groups.pmh.join(' ') || '特記事項なし。',
    social: groups.social.join(' ') || '特記事項なし。',
    family: groups.family.join(' ') || '特記事項なし。',
  };
}

function rankFor(rep){
  let r = RANKS[0];
  for(const x of RANKS){ if(rep>=x.min) r=x; }
  return r;
}
function nextRank(rep){
  const cur = rankFor(rep);
  return RANKS.find(r=>r.level===cur.level+1) || null;
}

          playedIds:d.playedIds||[], stats:Object.assign({}, this.state.stats, d.stats||{}),
          currentStreak:d.currentStreak||0,
          seenTerms:d.seenTerms||[], week:d.week||1, weekIndex:d.weekIndex||0, weekQueue:d.weekQueue||[]
        });
        if((d.stats && d.stats.cases>0) || (d.reputation!==undefined && d.reputation!==START_REPUTATION)) hasProgress = true;
      }
    }catch(e){}
    this.state.screen = hasProgress ? 'continueChoice' : 'title';
    render();
  },
  continueGame(){ this.state.screen='title'; render(); },
  async save(){
    try{
      await window.storage.set('career', JSON.stringify({
        reputation:this.state.reputation, playedIds:this.state.playedIds, stats:this.state.stats, seenTerms:this.state.seenTerms,
        week:this.state.week, weekIndex:this.state.weekIndex, weekQueue:this.state.weekQueue, currentStreak:this.state.currentStreak
      }), false);
    }catch(e){}
  },
  async reset(){
    Object.assign(this.state, {
      reputation:START_REPUTATION, playedIds:[], stats:{cases:0,diagCorrect:0,perfectWeeks:0,bestStreak:0,crashCount:0,clearedOnce:false,clearedTwice:false,clearedThrice:false}, seenTerms:[],
      week:1, weekIndex:0, weekQueue:[], weekReport:null, currentStreak:0,
    });
    await this.save();
    this.state.screen='title';
    render();
  },
  startCase(){
    const rank = rankFor(this.state.reputation);
    let pool = CASES.filter(c=>c.tier<=rank.maxTier);
    let loopStage = 1;
    // 2周目：1周目の全症例（tier1〜3）に、tier4の標準的な難症例を追加。
    // 3周目：2周目の全症例に、advanced指定の最難関症例をさらに追加。
    // どちらも「置き換え」ではなく「積み増し」で、プールは減らさず増やしていく。
    if(this.state.stats.clearedTwice){
      loopStage = 3;
      pool = CASES; // 全症例（base + tier4標準 + tier4 advanced）
    } else if(this.state.stats.clearedOnce){
      loopStage = 2;
      pool = CASES.filter(c=>c.tier<=3 || (c.tier===4 && !c.advanced));
    } else if(rank.specialty){
      // 現在のローテーション（専門科）に合った症例だけに絞り込む。該当症例が無ければ全体から選ぶ（安全弁）。
      const specialtyPool = pool.filter(c=>c.specialty===rank.specialty);
      if(specialtyPool.length>0) pool = specialtyPool;
    }
    const usedThisWeek = this.state.weekQueue.map(w=>w.caseId);
    let candidates = pool.filter(c=>!usedThisWeek.includes(c.id) && !this.state.playedIds.includes(c.id));
    if(candidates.length===0) candidates = pool.filter(c=>!usedThisWeek.includes(c.id));
    if(candidates.length===0) candidates = pool;
    const pick = candidates[Math.floor(Math.random()*candidates.length)];
    this.state.current = pick;
    this.state.currentIdentity = buildIdentity(pick, loopStage, Math.random()*1000000);
    this.state.currentChief = pickChiefVariant(pick);
    this.state.doneT=[];
    this.state.wastedCount=0;
    this.state.selDiag=null;
    this.state.selDisp=null;
    this.state.screen='chart';
    render();
  },
  runTest(name){
    const c = this.state.current;
    const node = c.tests.find(t=>t.name===name);
    if(!node) return;
    if(this.state.doneT.includes(name)) return;
    this.state.doneT.push(name);
    this.learnTermsFrom(node.result||(node.label||''));
    let crashed = false;
    if(c.urgent && !node.key){
      this.state.wastedCount += 1;
      if(this.state.wastedCount >= CRISIS_LIMIT){ this.state.screen='crisis'; crashed=true; }
    }
    render();
    if(crashed) Audio_.sfx('ng');
  },
  learnTermsFrom(text){
    Object.keys(GLOSSARY_FULL).forEach(term=>{
      if(text.includes(term) && !this.state.seenTerms.includes(term)) this.state.seenTerms.push(term);
    });
  },
  async acknowledgeCrisis(){
    const c = this.state.current;
    this.state.weekQueue.push({ caseId:c.id, crashed:true, identity:this.state.currentIdentity });
    this.state.weekIndex += 1;
    if(!this.state.playedIds.includes(c.id)) this.state.playedIds.push(c.id);
    this.state.stats.crashCount += 1;
    this.state.currentStreak = 0;
    this.state.lastWasCrash = true;
    await this.save();
    this.state.screen='submitted';
    render();
  },
  selectDiag(d){ this.state.selDiag=d; render(); },
  selectDisp(d){ this.state.selDisp=d; render(); },
  async submit(){
    if(!this.state.selDiag || !this.state.selDisp) return;
    const c = this.state.current;
    this.state.weekQueue.push({
      caseId:c.id, selDiag:this.state.selDiag, selDisp:this.state.selDisp, doneT:this.state.doneT.slice(), identity:this.state.currentIdentity,
    });
    this.state.weekIndex += 1;
    if(!this.state.playedIds.includes(c.id)) this.state.playedIds.push(c.id);
    this.state.lastWasCrash = false;
    await this.save();
    this.state.screen='submitted';
    render();
  },
  async goNextInWeek(){
    if(this.state.weekIndex >= WEEK_SIZE){
      await this.runWeeklyConference();
    } else {
      this.startCase();
    }
  },
  async runWeeklyConference(){
    const results = this.state.weekQueue.map(w=>{
      const c = CASES.find(x=>x.id===w.caseId);
      this.state.stats.cases += 1;
      if(w.crashed){
        this.learnTermsFrom(c.explain);
        this.state.currentStreak = 0;
        return {c, w, diagOK:false, dispOK:false, crashed:true, pts:-40, breakdown:[['患者急変によりICU搬送（重大インシデント）',-40]]};
      }
      const diagOK = w.selDiag === c.diagnosisCorrect;
      const dispOK = w.selDisp === c.disposition;
      const wastedTests = (w.doneT||[]).map(name=>c.tests.find(t=>t.name===name)).filter(t=>t && !t.key);
      let wastedCost = 0;
      wastedTests.forEach(t=>{ wastedCost += t.cost*3; });

      let pts = 0; const breakdown=[];
      if(!dispOK){
        // 治療方針の誤りは、診断名の正誤にかかわらず重大な管理エラーとして扱う。
        // 「本来は専門科へ引き継ぐべきなのに治療して終診した」場合は、専門的な治療機会を逃す危険な誤りとして特に重く減点する。
        const dangerous = c.disposition==='refer' && w.selDisp==='treat';
        const penalty = dangerous ? -40 : -20;
        breakdown.push([dangerous? '治療方針 誤り（専門科への引き継ぎが必要な患者を治療して終診）' : '治療方針 誤り（治療で対応可能な患者を専門科へ引き継ぎ）', penalty]);
        pts += penalty;
        this.state.currentStreak = 0;
      } else {
        pts += 10; breakdown.push(['治療方針（治療 or 引き継ぎ） 適切',10]);
        if(diagOK){ pts+=25; breakdown.push(['診断名 正解',25]); this.state.currentStreak+=1; }
        else { pts-=12; breakdown.push(['診断名 不正解',-12]); this.state.currentStreak=0; }
      }
      if(this.state.currentStreak > this.state.stats.bestStreak) this.state.stats.bestStreak = this.state.currentStreak;

      if(wastedTests.length>0){ pts -= wastedCost; breakdown.push([`不要な検査 ${wastedTests.length}件（費用の浪費）`, -wastedCost]); }
      else if(dispOK){ pts += 10; breakdown.push(['不要な検査なし（効率的な検査選択）',10]); }

      this.learnTermsFrom(c.explain);
      if(diagOK) this.state.stats.diagCorrect += 1;
      return {c, w, diagOK, dispOK, crashed:false, pts, breakdown, wastedTests};
    });
    const total = results.reduce((s,r)=>s+r.pts,0);
    const perfectWeek = results.length>0 && results.every(r=>r.diagOK && r.dispOK && !r.crashed);
    if(perfectWeek) this.state.stats.perfectWeeks += 1;
    const before = rankFor(this.state.reputation);
    this.state.reputation += total;
    const after = rankFor(this.state.reputation);
    const gameOver = this.state.reputation <= GAMEOVER_THRESHOLD;
    const leveledUp = after.level>before.level && !gameOver;
    const SPECIALIST_LEVEL = RANKS.find(r=>r.title==='総合診療専門医').level; // 1周目クリア：総合診療医になる
    const CHIEF_LEVEL = RANKS[RANKS.length-1].level;                          // 2周目クリア：医長になる
    const gameClear   = leveledUp && after.level===SPECIALIST_LEVEL && !this.state.stats.clearedOnce;
    const chiefPromo  = leveledUp && after.level===CHIEF_LEVEL && this.state.stats.clearedOnce && !this.state.stats.clearedTwice;
    const grandFinale = !gameOver && this.state.stats.clearedTwice && !this.state.stats.clearedThrice && this.state.reputation >= GRAND_FINALE_THRESHOLD;
    if(gameClear) this.state.stats.clearedOnce = true;
    if(chiefPromo) this.state.stats.clearedTwice = true;
    if(grandFinale) this.state.stats.clearedThrice = true;
    this.state.weekReport = {week:this.state.week, results, total, perfectWeek, leveledUp, demoted: after.level<before.level && !gameOver, newRank:after, gameOver, gameClear, chiefPromo, grandFinale};
    this.state.weekQueue = [];
    this.state.weekIndex = 0;
    this.state.week += 1;
    await this.save();
    this.state.screen='conference';
    render();
  },
  async afterConference(){
    if(this.state.weekReport && this.state.weekReport.gameOver){
      this.state.screen='gameover';
      render();
    } else if(this.state.weekReport && this.state.weekReport.grandFinale){
      this.state.screen='grandfinale';
      render();
    } else if(this.state.weekReport && this.state.weekReport.chiefPromo){
      this.state.screen='chiefpromo';
      render();
    } else if(this.state.weekReport && this.state.weekReport.gameClear){
      this.state.screen='gameclear';
      render();
    } else {
      this.state.screen='evaluation'; // 総合評価モーダルは毎週表示（昇進・降格・現状維持のいずれでも）
      render();
    }
  },
  closeEvaluation(){ this.state.weekReport=null; this.state.screen='title'; render(); },
};

/* ============================================================
   オーディオ（効果音のみ）
   ============================================================ */
const Audio_ = {
  ctx:null, gainNode:null,
  ensure(){ if(!this.ctx){ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); this.gainNode=this.ctx.createGain(); this.gainNode.gain.value=0.09; this.gainNode.connect(this.ctx.destination); } },
  sfx(kind){
    this.ensure();
    if(this.ctx.state==='suspended') this.ctx.resume();
    const now=this.ctx.currentTime;
    const play=(f,t0,dur,type='sine',vol=0.15)=>{
      const o=this.ctx.createOscillator(); const g=this.ctx.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.value=0; g.gain.linearRampToValueAtTime(vol,now+t0+0.02);
      g.gain.linearRampToValueAtTime(0,now+t0+dur);
      o.connect(g); g.connect(this.gainNode);
      o.start(now+t0); o.stop(now+t0+dur+0.05);
    };
    if(kind==='ok'){ play(523,0,.18); play(659,.12,.2); play(784,.24,.3); }
    else if(kind==='ng'){ play(200,0,.25,'sawtooth',.1); play(160,.15,.3,'sawtooth',.1); }
    else if(kind==='click'){ play(700,0,.06,'square',.06); }
    else if(kind==='fanfare'){ [523,659,784,1046].forEach((f,i)=>play(f,i*0.16,.35,'triangle',.16)); }
    else if(kind==='sad'){ [400,340,280,220].forEach((f,i)=>play(f,i*0.22,.4,'sine',.1)); }
  }
};

    <div class="um-track"><div class="um-fill" style="width:${pct}%"></div></div>
  </div>`;
}

  const panelLabel = clearedTwice ? '医長としての所見' : (clearedOnce ? '総合診療医としての所見' : '指導医のアドバイス');
  return `<div class="diffboard">

}

function testResultHtml(t){
  if(t.type==='lab') return labBar(t.label,t.value,t.unit,t.min,t.max,undefined,t.dispMax,t.abnormal);
  if(t.type==='ecg') return ecgSvg(t.pattern) + `<div style="margin-top:6px;">${withGlossary(t.result)}</div>`;
  return withGlossary(t.result);
}

function renderConference(){

  const deptName = k=>DEPARTMENTS[k]? `${DEPARTMENTS[k].emoji} ${DEPARTMENTS[k].name}` : k;
  const cards = rep.results.map((r,i)=>{
    const id_ = r.w.identity || {name:r.c.name, age:r.c.age, gender:r.c.gender};
    if(r.crashed){
      return `<details class="weekcard crashcard" ${i===0?'open':''}>
        <summary>
          <span class="wname">🚨 ${esc(id_.name)}様（${id_.age}歳・${id_.gender}）</span>

          <div class="explain">${withGlossary(r.c.explain)}</div>

    }
    const wastedNames = (r.wastedTests||[]).map(t=>`${esc(t.name)}（${costTag(t.cost)}）`).join('、');
    return `<details class="weekcard" ${i===0?'open':''}>
      <summary>
        <span class="wname">${esc(id_.name)}様（${id_.age}歳・${id_.gender}）</span>
        <span class="wverdicts">
          <span class="verdict ${r.diagOK?'ok':'ng'}">診断${r.diagOK?'○':'×'}</span>
          <span class="verdict ${r.dispOK?'ok':'ng'}">方針${r.dispOK?'○':'×'}</span>
          <span class="verdict ${r.pts>=0?'ok':'ng'}">${r.pts>=0?'+':''}${r.pts}pt</span>

      <div class="wbody">
        <div class="resultrow">
          <div class="resultbox">
            <h4>診断名</h4>
            <div class="yourans">あなたの回答：${esc(r.w.selDiag)} <span class="verdict ${r.diagOK?'ok':'ng'}">${r.diagOK?'正解':'不正解'}</span></div>
            ${!r.diagOK?`<div class="correctans">正解：${esc(r.c.diagnosisCorrect)}</div>`:''}
          </div>
          <div class="resultbox">
            <h4>治療方針</h4>
            <div class="yourans">あなたの回答：${r.w.selDisp==='treat'?'🩹 治療して終診':'🏥 専門科へ引き継ぎ'} <span class="verdict ${r.dispOK?'ok':'ng'}">${r.dispOK?'適切':'不適切'}</span></div>
            ${r.c.disposition==='refer'?`<div class="muted">正しい引き継ぎ先：${deptName(r.c.deptCorrect)}</div>`:`<div class="muted">${r.c.treatmentNote?esc(r.c.treatmentNote):''}</div>`}
          </div>
        </div>
        ${wastedNames? `<p class="muted">⚠️ 不要な検査：${wastedNames}</p>` : ''}
        <div class="explain">${withGlossary(r.c.explain)}</div>
        <div class="scorebreak">${r.breakdown.map(b=>`<div class="scorepill ${b[1]>=0?'pos':'neg'}">${b[0]}: <b>${b[1]>=0?'+':''}${b[1]}</b></div>`).join('')}</div>
      </div>
    </details>`;
  }).join('');
  renderShell(`
    <div class="card">
      <div class="confroom-badge">👨‍⚕️</div>
      <div class="conf-heading">

        <div class="iform-title"><span>厚生労働省　新設医療機関設立準備室</span><span></span></div>

        拝啓　貴殿におかれましては、桜坂大学医学部附属病院総合診療科医長として、数多の難症例に対し卓越した臨床推理と誠実な診療を積み重ねてこられたこと、ここに深く敬意を表します。<br><br>
        この度、国が新たに設立する高度総合診療センター「<b style="color:var(--gold);">国立中央総合診療研究病院</b>」の開院にあたり、同院の<b style="color:var(--gold);">初代院長</b>として、貴殿を招聘いたしたく存じます。<br><br>
        貴殿のこれまでの歩みは、まさにこの国の総合診療を支えるにふさわしいものです。ご快諾いただけますよう、心よりお願い申し上げます。<br><br>
        敬具
        </p>
      </div>
      <div class="mentor-bubble-wrap" style="max-width:480px;margin:0 auto 16px;text-align:left;">
        <div class="mentor-avatar">👩‍⚕️</div>
        <div class="mentor-bubble">
          <div class="mentor-name">指導医</div>
          「……まさか、国の新しい病院の院長にお声がかかるなんてね。最初にこの科の扉を叩いた頃のあなたを思うと、感慨深いものがあるわ。胸を張って、行ってらっしゃい。あなたなら、きっと素晴らしい病院を作れる。今までお疲れ様、そして――本当におめでとう。」
        </div>
      </div>
      <div class="gameover-stats" style="margin-bottom:18px;">通算症例数：${s.stats.cases}件　診断正答率：${s.stats.cases? Math.round(100*s.stats.diagCorrect/s.stats.cases):0}%　最高連続正解：${s.stats.bestStreak}　最終評価スコア：${s.reputation}pt</div>
      <p class="muted">桜坂大学病院を巣立ち、国立中央総合診療研究病院の院長として、新たな一歩を踏み出しました。――物語は、ここでひとまずの完結を迎えます。</p>
      <div class="btnrow" style="justify-content:center;">
        <button class="btn" id="btn-finale-continue">この後も診療を続ける</button>
      </div>
    </div>
  `);
  document.getElementById('btn-finale-continue').onclick=()=>{ Audio_.sfx('click'); Game.closeEvaluation(); };
}

function renderContinueChoice(){
  const s = Game.state;
  const rank = rankFor(s.reputation);
  renderShell(`
    <div class="card" style="text-align:center;padding:34px 20px;">
      <div style="font-size:44px;">📋</div>
      <h2 style="border:none;padding:0;justify-content:center;font-family:'Hiragino Mincho ProN','Shippori Mincho',serif;font-size:20px;margin:10px 0 8px;">前回の記録が見つかりました</h2>
      <p class="muted">現在の階級：<b style="color:var(--ecg);">${esc(rank.title)}</b>　評価スコア：${s.reputation}pt　通算症例数：${s.stats.cases}件</p>
      <div class="btnrow" style="justify-content:center;">
        <button class="btn" id="btn-continue">続きから始める</button>
        <button class="btn secondary" id="btn-restart-choice">最初からやり直す</button>
      </div>
    </div>
  `);
  document.getElementById('btn-continue').onclick=()=>{ Audio_.sfx('click'); Game.continueGame(); };
  document.getElementById('btn-restart-choice').onclick=()=>{ if(confirm('これまでの評価と記録をすべて削除して、最初からやり直します。よろしいですか？')) Game.reset(); };
}

function openGlossary(){
  const s = Game.state;
  const terms = s.seenTerms.length? s.seenTerms.slice().sort() : [];
  const list = terms.length===0
    ? `<p class="muted">まだ用語が登録されていません。カルテを読んだり検査を行うと、出てきた医学用語がここに解説付きで記録されます。</p>`
    : `<div class="glossary-list">${terms.map(t=>`<div class="gitem"><b>${esc(t)}</b><p>${esc(GLOSSARY_FULL[t])}</p></div>`).join('')}</div>`;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" id="glossary-bg">
      <div class="modal" style="max-width:520px;text-align:left;">
        <h2 style="text-align:center;">📖 医学用語辞典</h2>
        <p class="muted" style="text-align:center;">プレイ中に登場した用語（${terms.length}語）</p>
        ${list}
        <div class="btnrow" style="justify-content:center;margin-top:14px;"><button class="btn secondary" id="btn-closeglos">閉じる</button></div>
      </div>
    </div>`;
  document.getElementById('btn-closeglos').onclick=()=>{ document.getElementById('modal-root').innerHTML=''; };
  document.getElementById('glossary-bg').onclick=(e)=>{ if(e.target.id==='glossary-bg') document.getElementById('modal-root').innerHTML=''; };
}

function render(){
  const s = Game.state;
  if(s.screen==='continueChoice') renderContinueChoice();
  else if(s.screen==='title') renderTitle();
  else if(s.screen==='chart') renderChart();
  else if(s.screen==='crisis') renderCrisis();
  else if(s.screen==='submitted') renderSubmitted();
  else if(s.screen==='conference') renderConference();
  else if(s.screen==='evaluation'){ renderConference(); renderEvaluation(); }
  else if(s.screen==='gameover') renderGameOver();
  else if(s.screen==='gameclear') renderGameClear();
  else if(s.screen==='chiefpromo') renderChiefPromo();
  else if(s.screen==='grandfinale') renderGrandFinale();
}

Game.init();
</script>
</body>
</html>
